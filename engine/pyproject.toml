[project]
name = "grail-engine"
version = "0.1.0"
description = "GRAIL quant engine: deterministic, pure (no I/O) decision library"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grail_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
