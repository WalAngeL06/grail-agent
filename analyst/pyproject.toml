[project]
name = "grail-analyst"
version = "0.1.0"
description = "GRAIL LLM analyst: may veto or shrink engine orders, never add risk (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grail_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
